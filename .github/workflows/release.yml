name: Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - release/**

# The default GITHUB_TOKEN is read-only; creating the draft release and its
# tag requires write access to repository contents.
permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.21.0
          cache: "yarn"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "native/hydra-native -> target"

      - name: Cache third-party binaries
        uses: actions/cache@v4
        with:
          path: |
            binaries/7zzs
            binaries/umu/umu-run
            ludusavi/ludusavi
          key: binaries-${{ runner.os }}-${{ hashFiles('scripts/postinstall.cjs') }}

      # The torrent bridge builds libtorrent, Boost and OpenSSL from source
      # through vcpkg during postinstall (build:native).
      - name: Install native build prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build pkg-config curl zip unzip tar autoconf automake libtool

      # vcpkg checks each package ABI (compiler, flags), so fallback restores
      # stay within the same runner image.
      - name: Prepare vcpkg binary cache
        id: native-cache
        run: |
          cache_dir="$RUNNER_TEMP/hydra-vcpkg-archives"
          mkdir -p "$cache_dir"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$cache_dir" >> "$GITHUB_ENV"
          echo "prefix=v1-vcpkg-$RUNNER_OS-$ImageOS-$ImageVersion-$RUNNER_ARCH" >> "$GITHUB_OUTPUT"

      - name: Restore vcpkg binary packages
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.native-cache.outputs.prefix }}-${{ hashFiles('native/torrent-bridge/**/vcpkg*.json', 'native/torrent-bridge/**/triplets/**') }}
          restore-keys: |
            ${{ steps.native-cache.outputs.prefix }}-

      - name: Install dependencies
        run: yarn --frozen-lockfile

      # Save before packaging so a later failure keeps the compiled packages.
      - name: Save vcpkg binary packages
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Cache Electron and electron-builder
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: Build Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          yarn build:linux
        env:
          MAIN_VITE_API_URL: ${{ vars.MAIN_VITE_API_URL }}
          MAIN_VITE_AUTH_URL: ${{ vars.MAIN_VITE_AUTH_URL }}
          MAIN_VITE_CHECKOUT_URL: ${{ vars.MAIN_VITE_CHECKOUT_URL }}
          MAIN_VITE_NIMBUS_API_URL: ${{ vars.MAIN_VITE_NIMBUS_API_URL }}
          RENDERER_VITE_EXTERNAL_RESOURCES_URL: ${{ vars.EXTERNAL_RESOURCES_URL }}
          MAIN_VITE_EXTERNAL_RESOURCES_URL: ${{ vars.EXTERNAL_RESOURCES_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RENDERER_VITE_REAL_DEBRID_REFERRAL_ID: ${{ vars.RENDERER_VITE_REAL_DEBRID_REFERRAL_ID }}
          RENDERER_VITE_TORBOX_REFERRAL_CODE: ${{ vars.RENDERER_VITE_TORBOX_REFERRAL_CODE }}
          MAIN_VITE_LAUNCHER_SUBDOMAIN: ${{ vars.MAIN_VITE_LAUNCHER_SUBDOMAIN }}

      # Gear Lever / AppImageUpdate read the standard `.upd_info` ELF section,
      # which electron-builder leaves zero-filled. Embed the gh-releases-zsync
      # update string (the script also re-aligns latest-linux.yml's sha512 so
      # the in-app updater keeps accepting the patched file) and publish a
      # .zsync alongside for delta-capable updaters.
      - name: Embed AppImage update info
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zsync
          APPIMAGE=$(ls dist/*.AppImage)
          node scripts/embed-appimage-update-info.mjs "$APPIMAGE" \
            "gh-releases-zsync|CappyT|hydra|latest|hydralauncher-*.AppImage.zsync"
          (cd dist && zsyncmake -u "$(basename "$APPIMAGE")" "$(basename "$APPIMAGE")")

      # The workflow runs on release/** branch pushes, so there is no tag in
      # the ref; gh-release requires one. Derive it from the app version.
      - name: Read app version
        id: app_version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: v${{ steps.app_version.outputs.version }}
          # Without this the tag is created at the default branch's HEAD on
          # publish, which may have moved past the commit that was built.
          target_commitish: ${{ github.sha }}
          name: v${{ steps.app_version.outputs.version }}
          files: |
            dist/*.AppImage
            dist/latest-linux.yml
            dist/*.blockmap
            dist/*.zsync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
